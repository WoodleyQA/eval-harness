name: eval-harness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual run of the live judge validation (see the validate-judge job).
  workflow_dispatch:

jobs:
  # Offline tests: ingest and wiring. No API key, no cost, runs on every push.
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline tests
        run: pytest tests/ -m "not live" -v

  # Live validation: re-checks the judge against the 14 hand-labeled claims
  # using real model calls. Costs tokens, so it runs on demand rather than on
  # every push (Actions tab > eval-harness CI > Run workflow).
  validate-judge:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run live judge validation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pytest tests/ -m live -v
